[package]
name = "nexis_kernel"
version = "0.1.0"
edition = "2021"
authors = ["IronVeil Team"]
description = "Privacy-focused operating system kernel"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Bootloader and low-level support
bootloader = { version = "0.11.0", features = ["map_physical_memory"] }
x86_64 = { version = "0.14", features = ["instructions", "registers"] }

# Synchronization primitives
spin = { version = "0.9", features = ["mutex", "rwlock", "once"] }
lazy_static = { version = "1.4", features = ["spin_no_std"] }

# Hardware abstraction
uart_16550 = "0.2"
pc-keyboard = "0.6"
pic8259 = "0.10"

# Data structures
linked_list_allocator = "0.10"
heapless = { version = "0.7", features = ["serde"] }

# Bit manipulation
bit_field = "0.10"
bitflags = "1.3"

# Optional features for debugging
log = { version = "0.4", optional = true }
debugit = { version = "0.1", optional = true }

[build-dependencies]
cc = "1.0"

[features]
default = []
debug = ["log", "debugit"]
testing = []
serial_debug = []

# Memory allocator configuration
[dependencies.linked_list_allocator]
version = "0.10"
default-features = false

# Target-specific configuration
[target.'cfg(target_arch = "x86_64")']
dependencies = { }

# Development dependencies for testing
[dev-dependencies]
bootimage = { version = "0.11", optional = true }

# Profile configurations
[profile.dev]
panic = "abort"
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true

[profile.release]
panic = "abort"
opt-level = "s"  # Optimize for size
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"      # Full LTO for kernel
codegen-units = 1
incremental = false
strip = true

# Test profile
[profile.test]
panic = "abort"
opt-level = 0
debug = true

# Custom cargo commands
[package.metadata.bootimage]
default-target = "x86_64-nexis.json"
output = "bootimage-nexis.bin"
minimum-image-size = 0      # The image will be at least this big (in bytes)
# UEFI boot support
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300          # Timeout in seconds

# Documentation configuration
[package.metadata.docs.rs]
default-target = "x86_64-nexis"
targets = ["x86_64-nexis"]

# Workspace configuration (if part of a larger workspace)
[workspace]
members = []
exclude = []

# Custom build configuration
[build]
rustflags = [
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-Z", "merge-functions=disabled",
]

# Environment variables for build
[env]
RUST_TARGET_PATH = { value = ".", relative = true }
