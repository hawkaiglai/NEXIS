[package]
name = "build_tools"
version = "0.1.0"
edition = "2021"
authors = ["IronVeil Development Team"]
description = "Build automation and tooling for IronVeil OS"

[dependencies]
# System interaction and process management
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File system and path operations
walkdir = "2.3"
tempfile = "3.0"

# Process execution and command line
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
colored = "2.0"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Async runtime for concurrent operations
tokio = { version = "1.0", features = ["full"] }

# Compression for USB image creation
flate2 = "1.0"
tar = "0.4"

# Cross-platform system info
sysinfo = "0.29"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
